<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aethelrun - Delhi Metro Rush</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #0b0c10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff9933;
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 800;
            box-shadow: 0 0 12px rgba(255, 153, 51, 0.4);
        }
        .coin-box {
            border-color: #ffd700;
            color: #ffd700;
        }
        .board-status {
            text-align: center;
            font-size: 14px;
            color: #00ffcc;
            font-weight: bold;
            text-shadow: 0 0 8px #00ffcc;
            margin-top: 5px;
            pointer-events: none;
        }
        /* Screens */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 40px;
            color: #ff9933;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-shadow: 0 0 20px #ff9933;
            text-align: center;
        }
        p.subtitle {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
            max-width: 320px;
            line-height: 1.4;
        }
        .select-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
            width: 320px;
        }
        .select-section h3 {
            color: #00ffcc;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .options-row {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }
        .opt-btn {
            background: #222;
            border: 2px solid #555;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
        }
        .opt-btn.active {
            border-color: #ff9933;
            background: rgba(255, 153, 51, 0.2);
            box-shadow: 0 0 10px rgba(255, 153, 51, 0.5);
        }
        .final-stats {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 15px 35px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
            color: white;
            font-size: 20px;
        }
        .final-stats div {
            margin: 6px 0;
        }
        .btn {
            background: linear-gradient(135deg, #ff9933, #ff3366);
            border: none;
            padding: 14px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 153, 51, 0.6);
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="hud">
            <div>
                <div class="stat-box">SCORE: <span id="score-val">0</span></div>
                <div class="board-status" id="board-status-text">HOVERBOARD: OFF (Double Tap)</div>
            </div>
            <div class="stat-box coin-box">🪙 <span id="coin-val">0</span></div>
        </div>
    </div>

    <!-- Start Menu with Character & Hoverboard Customization -->
    <div id="start-screen" class="overlay-screen">
        <h1>AETHELRUN</h1>
        <p class="subtitle">Delhi Metro Track Edition<br>Double Tap anywhere during game to activate Hoverboard!</p>
        
        <div class="select-section">
            <h3>CHOOSE CHARACTER</h3>
            <div class="options-row">
                <button class="opt-btn active" onclick="setChar(0, this)">Cyber boy</button>
                <button class="opt-btn" onclick="setChar(1, this)">Delhi Runner</button>
            </div>
        </div>

        <div class="select-section">
            <h3>CHOOSE HOVERBOARD</h3>
            <div class="options-row">
                <button class="opt-btn active" onclick="setBoard(0, this)">Neon Board</button>
                <button class="opt-btn" onclick="setBoard(1, this)">Gold Cruiser</button>
            </div>
        </div>

        <button class="btn" onclick="startGame()">TAP TO PLAY</button>
    </div>

    <!-- Game Over Menu -->
    <div id="game-over-screen" class="overlay-screen hidden">
        <h1 style="color: #ff3366; text-shadow: 0 0 20px #ff3366;">CRASHED!</h1>
        <div class="final-stats">
            <div>Score: <strong id="final-score" style="color:#ff9933;">0</strong></div>
            <div>Coins: <strong id="final-coins" style="color:#ffd700;">0</strong></div>
        </div>
        <button class="btn" onclick="startGame()">PLAY AGAIN</button>
    </div>

    <script>
        // --- GAME CONFIG & SELECTIONS ---
        const LANES = [-2.6, 0, 2.6];
        let currentLane = 1;
        let score = 0;
        let coins = 0;
        let gameSpeed = 0.35;
        let isGameRunning = false;

        let selectedCharacter = 0; // 0 or 1
        let selectedBoard = 0;     // 0 or 1
        let hasHoverboard = false; // Active hoverboard protection

        function setChar(index, btn) {
            selectedCharacter = index;
            document.querySelectorAll('.select-section')[0].querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function setBoard(index, btn) {
            selectedBoard = index;
            document.querySelectorAll('.select-section')[1].querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // Jump Physics
        let isJumping = false;
        let yVelocity = 0;
        const GRAVITY = -0.018;
        const JUMP_POWER = 0.35;
        const PLAYER_BASE_Y = 0.75;

        // --- THREE.JS SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0e15);
        scene.fog = new THREE.FogExp2(0x0d0e15, 0.016);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 150);
        camera.position.set(0, 4.8, 7.5);
        camera.lookAt(0, 1.2, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTS ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffcc88, 0.9);
        dirLight.position.set(12, 25, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- DELHI ROAD & METRO ENVIRONMENT ---
        const groundGeo = new THREE.PlaneGeometry(16, 300);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x1c1e24, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.z = -120;
        ground.receiveShadow = true;
        scene.add(ground);

        // Delhi Road Dividers / Tracks
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xff9933 });
        [-4.2, -1.4, 1.4, 4.2].forEach(xPos => {
            const lineGeo = new THREE.PlaneGeometry(0.1, 300);
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(xPos, 0.01, -120);
            scene.add(line);
        });

        // Delhi Metro Pillars on sides (Theme element)
        const pillars = [];
        const pillarGeo = new THREE.BoxGeometry(1.2, 12, 1.2);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x555b6e, roughness: 0.5 });
        for (let i = 0; i < 20; i++) {
            const pLeft = new THREE.Mesh(pillarGeo, pillarMat);
            pLeft.position.set(-6.5, 6, -i * 15);
            scene.add(pLeft);
            pillars.push(pLeft);

            const pRight = new THREE.Mesh(pillarGeo, pillarMat);
            pRight.position.set(6.5, 6, -i * 15);
            scene.add(pRight);
            pillars.push(pRight);
        }

        // Moving Track Sleepers
        const sleepers = [];
        const sleeperGeo = new THREE.BoxGeometry(9.0, 0.04, 0.4);
        const sleeperMat = new THREE.MeshBasicMaterial({ color: 0x333945 });
        for (let i = 0; i < 35; i++) {
            const s = new THREE.Mesh(sleeperGeo, sleeperMat);
            s.position.set(0, 0.02, -i * 3.5);
            scene.add(s);
            sleepers.push(s);
        }

        // --- PLAYER CHARACTER GROUP ---
        const playerGroup = new THREE.Group();
        
        // Body & Head meshes created dynamically based on character selection
        let playerBody, playerHead, hoverboardMesh;

        function buildPlayer() {
            // Clear old meshes
            while(playerGroup.children.length > 0){ 
                playerGroup.remove(playerGroup.children[0]); 
            }

            const bodyColor = selectedCharacter === 0 ? 0x00ffcc : 0xff3366;
            const bodyGeo = new THREE.BoxGeometry(0.85, 1.2, 0.65);
            const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.2 });
            playerBody = new THREE.Mesh(bodyGeo, bodyMat);
            playerBody.castShadow = true;
            playerGroup.add(playerBody);

            const headGeo = new THREE.BoxGeometry(0.65, 0.65, 0.65);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            playerHead = new THREE.Mesh(headGeo, headMat);
            playerHead.position.set(0, 0.9, 0);
            playerGroup.add(playerHead);

            // Hoverboard Mesh (Hidden initially)
            const boardColor = selectedBoard === 0 ? 0x00ffcc : 0xffd700;
            const boardGeo = new THREE.BoxGeometry(1.4, 0.12, 0.6);
            const boardMat = new THREE.MeshStandardMaterial({ color: boardColor, metalness: 0.8, roughness: 0.1 });
            hoverboardMesh = new THREE.Mesh(boardGeo, boardMat);
            hoverboardMesh.position.set(0, -0.7, 0);
            hoverboardMesh.visible = false;
            playerGroup.add(hoverboardMesh);

            playerGroup.position.set(LANES[1], PLAYER_BASE_Y, 0);
            scene.add(playerGroup);
        }

        buildPlayer();

        // --- OBSTACLES & COINS ARRAYS ---
        let obstacles = [];
        let coinItems = [];
        let spawnCounter = 0;

        function spawnEntities() {
            const randomLane = Math.floor(Math.random() * 3);
            const typeRand = Math.random();

            if (typeRand < 0.45) {
                // Delhi Metro Train / Heavy Barrier
                const trainGeo = new THREE.BoxGeometry(2.1, 3.4, 6.5);
                const trainMat = new THREE.MeshStandardMaterial({ color: 0x0044cc, roughness: 0.3 });
                const train = new THREE.Mesh(trainGeo, trainMat);
                train.position.set(LANES[randomLane], 1.7, -95);
                train.castShadow = true;
                train.userData = { type: 'train', w: 2.0, h: 3.4, d: 6.2 };
                scene.add(train);
                obstacles.push(train);
            } else if (typeRand < 0.8) {
                // Low Road Barrier (Jump over)
                const barGeo = new THREE.BoxGeometry(2.1, 1.0, 0.5);
                const barMat = new THREE.MeshStandardMaterial({ color: 0xff9933, roughness: 0.4 });
                const barrier = new THREE.Mesh(barGeo, barMat);
                barrier.position.set(LANES[randomLane], 0.5, -95);
                barrier.castShadow = true;
                barrier.userData = { type: 'barrier', w: 2.0, h: 1.0, d: 0.5 };
                scene.add(barrier);
                obstacles.push(barrier);
            }

            // Spawn Coins
            const coinLane = (randomLane + 1 + Math.floor(Math.random() * 2)) % 3;
            const coinGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.15, 16);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });

            for (let i = 0; i < 3; i++) {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.z = Math.PI / 2;
                coin.position.set(LANES[coinLane], 0.9, -95 - (i * 2.5));
                scene.add(coin);
                coinItems.push(coin);
            }
        }

        // --- CONTROLS & DOUBLE TAP FOR HOVERBOARD ---
        function moveLeft() { if (currentLane > 0) currentLane--; }
        function moveRight() { if (currentLane < 2) currentLane++; }
        function jump() {
            if (!isJumping) {
                isJumping = true;
                yVelocity = JUMP_POWER;
            }
        }

        function toggleHoverboard() {
            if (!isGameRunning) return;
            hasHoverboard = !hasHoverboard;
            if (hoverboardMesh) hoverboardMesh.visible = hasHoverboard;
            const statusText = document.getElementById('board-status-text');
            if (hasHoverboard) {
                statusText.innerText = "HOVERBOARD: ACTIVE (Protected!)";
                statusText.style.color = "#ffd700";
            } else {
                statusText.innerText = "HOVERBOARD: OFF (Double Tap)";
                statusText.style.color = "#00ffcc";
            }
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (!isGameRunning) return;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveRight();
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') jump();
            if (e.key === 'Shift') toggleHoverboard();
        });

        // Touch & Double Tap Detection
        let touchStartX = 0;
        let touchStartY = 0;
        let lastTapTime = 0;

        window.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;

            // Double tap check
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            if (tapLength < 300 && tapLength > 0) {
                toggleHoverboard();
            }
            lastTapTime = currentTime;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (!isGameRunning) return;
            const dx = e.changedTouches[0].screenX - touchStartX;
            const dy = e.changedTouches[0].screenY - touchStartY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) moveRight();
                else if (dx < -30) moveLeft();
            } else {
                if (dy < -30) jump();
            }
        }, { passive: true });

        // --- START & RESET GAME ---
        function startGame() {
            buildPlayer(); // apply selected character & board
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');

            obstacles.forEach(o => scene.remove(o));
            coinItems.forEach(c => scene.remove(c));
            obstacles = [];
            coinItems = [];

            currentLane = 1;
            score = 0;
            coins = 0;
            gameSpeed = 0.38;
            isJumping = false;
            yVelocity = 0;
            hasHoverboard = false;
            if (hoverboardMesh) hoverboardMesh.visible = false;
            document.getElementById('board-status-text').innerText = "HOVERBOARD: OFF (Double Tap)";
            document.getElementById('board-status-text').style.color = "#00ffcc";

            playerGroup.position.set(LANES[1], PLAYER_BASE_Y, 0);
            playerGroup.rotation.set(0, 0, 0);

            document.getElementById('score-val').innerText = '0';
            document.getElementById('coin-val').innerText = '0';

            isGameRunning = true;
        }

        function triggerGameOver() {
            if (hasHoverboard) {
                // Hoverboard absorbs the crash and breaks!
                hasHoverboard = false;
                if (hoverboardMesh) hoverboardMesh.visible = false;
                document.getElementById('board-status-text').innerText = "HOVERBOARD BROKEN! (Double Tap)";
                document.getElementById('board-status-text').style.color = "#ff3366";
                return;
            }

            isGameRunning = false;
            document.getElementById('final-score').innerText = Math.floor(score);
            document.getElementById('final-coins').innerText = coins;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // --- MAIN GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (isGameRunning) {
                const targetX = LANES[currentLane];
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.22;

                if (isJumping) {
                    playerGroup.position.y += yVelocity;
                    yVelocity += GRAVITY;
                    playerGroup.rotation.x -= 0.12;
                    if (playerGroup.position.y <= PLAYER_BASE_Y) {
                        playerGroup.position.y = PLAYER_BASE_Y;
                        playerGroup.rotation.x = 0;
                        isJumping = false;
                        yVelocity = 0;
                    }
                }

                // Move Track & Pillars
                sleepers.forEach(s => {
                    s.position.z += gameSpeed;
                    if (s.position.z > 8) s.position.z -= 35 * 3.5;
                });

                pillars.forEach(p => {
                    p.position.z += gameSpeed;
                    if (p.position.z > 10) p.position.z -= 20 * 15;
                });

                spawnCounter++;
                const spawnRate = Math.max(25, Math.floor(55 - gameSpeed * 35));
                if (spawnCounter >= spawnRate) {
                    spawnEntities();
                    spawnCounter = 0;
                }

                // Obstacles & Collisions
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.position.z += gameSpeed;

                    const zDiff = Math.abs(playerGroup.position.z - obs.position.z);
                    const xDiff = Math.abs(playerGroup.position.x - obs.position.x);

                    if (zDiff < (0.35 + obs.userData.d / 2) && xDiff < (0.45 + obs.userData.w / 2)) {
                        const playerBottom = playerGroup.position.y - 0.65;
                        const obsTop = obs.position.y + (obs.userData.h / 2);
                        if (playerBottom < obsTop - 0.15) {
                            triggerGameOver();
                        }
                    }

                    if (obs.position.z > 12) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Coins
                for (let i = coinItems.length - 1; i >= 0; i--) {
                    const c = coinItems[i];
                    c.position.z += gameSpeed;
                    c.rotation.y += 0.08;

                    const dist = playerGroup.position.distanceTo(c.position);
                    if (dist < 1.3) {
                        coins++;
                        score += 15;
                        document.getElementById('coin-val').innerText = coins;
                        scene.remove(c);
                        coinItems.splice(i, 1);
                        continue;
                    }

                    if (c.position.z > 12) {
                        scene.remove(c);
                        coinItems.splice(i, 1);
                    }
                }

                score += 0.25;
                gameSpeed += 0.00012;
                document.getElementById('score-val').innerText = Math.floor(score);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
